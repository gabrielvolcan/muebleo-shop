<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Muebleo — Escritorios, sillas y mobiliario de oficina | Catálogo 2026</title>
  <meta name="description" content="Catálogo 2026 de Muebleo. Escritorios, sillas ergonómicas, estanterías y todo el mobiliario para tu espacio de trabajo. Consultá por WhatsApp."/>
  <meta name="robots" content="index, follow"/>
  <meta name="theme-color" content="#07011C"/>

  <link rel="canonical" href="https://muebleo.shop/"/>

  <link rel="icon" href="/isotripomuebleo.svg"/>

  <meta property="og:type"        content="website"/>
  <meta property="og:url"         content="https://muebleo.shop/"/>
  <meta property="og:title"       content="Muebleo — Catálogo 2026"/>
  <meta property="og:description" content="Escritorios, sillas ergonómicas y mobiliario de oficina. Financiación y envíos a todo el país."/>
  <meta property="og:image"       content="https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=1200&q=85"/>
  <meta property="og:locale"      content="es_AR"/>
  <meta property="og:site_name"   content="Muebleo"/>

  <meta name="twitter:card"        content="summary_large_image"/>
  <meta name="twitter:title"       content="Muebleo — Catálogo 2026"/>
  <meta name="twitter:description" content="Escritorios, sillas ergonómicas y mobiliario de oficina."/>
  <meta name="twitter:image"       content="https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=1200&q=85"/>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FurnitureStore",
    "name": "Muebleo",
    "url": "https://muebleo.shop",
    "description": "Escritorios, sillas ergonómicas y mobiliario de oficina.",
    "potentialAction": { "@type": "ViewAction", "target": "https://muebleo.shop/#catalogo" }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg:    #07011C;
      --bg2:   #0D032A;
      --bg3:   #150540;
      --card:  #0A0227;
      --cardh: #160648;
      --y:     #DFC8AE;
      --yl:    #EDD9C4;
      --txt:   #F0EBE4;
      --txt2:  #9A8E82;
      --txt3:  #4A4238;
      --bdr:   rgba(223,200,174,.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--txt); -webkit-font-smoothing: antialiased; }
    .fp { font-family: 'Syne', system-ui, sans-serif; }

    /* ── Reveal ── */
    .rv { opacity:0; transform:translateY(20px); transition: opacity .6s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1); }
    .rv.on { opacity:1; transform:none; }
    .d1{transition-delay:.06s}.d2{transition-delay:.12s}.d3{transition-delay:.18s}
    .d4{transition-delay:.24s}.d5{transition-delay:.30s}.d6{transition-delay:.36s}

    /* ── Product card ── */
    .pcard { background: var(--card); border: 1px solid var(--bdr); border-radius: 10px; overflow: hidden; transition: border-color .25s, transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s; cursor: pointer; }
    .pcard:hover { border-color: rgba(223,200,174,.35); transform: translateY(-5px); box-shadow: 0 20px 50px rgba(0,0,0,.6); }
    .pcard-img { overflow: hidden; aspect-ratio: 4/3; }
    .pcard-img img { width:100%; height:100%; object-fit:cover; transition: transform .55s cubic-bezier(.16,1,.3,1); display:block; }
    .pcard:hover .pcard-img img { transform: scale(1.07); }

    /* ── Catalog grid ── */
    .cat-grid { display:grid; gap:24px; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); }

    /* ── Hero ── */
    .hero-section { position:relative; min-height:90vh; display:flex; align-items:center; overflow:hidden; }
    .hero-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; }
    .hero-overlay { position:absolute; inset:0; background:linear-gradient(125deg, rgba(7,1,28,.93) 0%, rgba(7,1,28,.52) 55%, rgba(7,1,28,.72) 100%); }
    .hero-content { position:relative; z-index:2; padding:100px 56px; max-width:820px; }
    @media(max-width:640px) { .hero-content { padding:80px 24px; } }

    /* ── Navbar ── */
    .navbar { position:sticky; top:0; z-index:100; background:rgba(7,1,28,.97); backdrop-filter:blur(16px); border-bottom:1px solid var(--bdr); }
    .navbar-inner { max-width:1400px; margin:0 auto; padding:0 32px; height:76px; display:flex; align-items:center; justify-content:space-between; }
    .nav-links { display:flex; gap:36px; align-items:center; }
    .nav-link { color:var(--txt2); font-size:.875rem; font-weight:500; text-decoration:none; transition:color .2s; cursor:pointer; letter-spacing:.01em; }
    .nav-link:hover { color:var(--txt); }
    .hamburger { display:none; background:none; border:none; cursor:pointer; padding:8px; }
    .hamburger span { display:block; width:22px; height:2px; background:var(--txt); margin:5px 0; transition:.3s; border-radius:2px; }
    .mobile-menu { display:none; }
    @media(max-width:768px) {
      .nav-links { display:none; }
      .hamburger { display:block; }
      .mobile-menu.open { display:flex; flex-direction:column; gap:0; background:var(--bg2); border-top:1px solid var(--bdr); padding:8px 0; }
      .mobile-menu .nav-link { padding:14px 24px; border-bottom:1px solid var(--bdr); }
    }

    /* ── Promo bar ── */
    .promo-bar { background:var(--y); color:#000; font-size:.78rem; font-weight:600; text-align:center; padding:8px 40px; position:relative; letter-spacing:.04em; }
    .promo-close { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1rem; font-weight:700; color:#000; opacity:.6; }

    /* ── Section ── */
    .section { max-width:1300px; margin:0 auto; padding:72px 24px; }
    .sec-label { font-size:.72rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--y); }
    .sec-title { font-size:clamp(1.8rem,4vw,2.8rem); font-weight:800; letter-spacing:-.02em; margin-top:6px; }
    .y-line { width:40px; height:3px; background:var(--y); margin:16px 0; border-radius:2px; }

    /* ── Search ── */
    .search-wrap { position:relative; margin-bottom:20px; }
    .search-input { width:100%; background:var(--bg2); border:1px solid var(--bdr); border-radius:99px; padding:12px 46px 12px 48px; color:var(--txt); font-size:.9rem; outline:none; transition:border-color .2s,box-shadow .2s; font-family:inherit; }
    .search-input:focus { border-color:rgba(245,166,35,.5); box-shadow:0 0 0 3px rgba(245,166,35,.08); }
    .search-input::placeholder { color:var(--txt3); }
    .search-icon { position:absolute; left:18px; top:50%; transform:translateY(-50%); color:var(--txt3); font-size:1rem; pointer-events:none; }
    .search-clear { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--txt2); cursor:pointer; font-size:1.2rem; line-height:1; padding:4px; transition:color .2s; }
    .search-clear:hover { color:var(--txt); }

    /* ── Filter pills ── */
    .pill { padding:7px 18px; border-radius:99px; font-size:.78rem; font-weight:500; cursor:pointer; border:1px solid var(--bdr); background:transparent; color:var(--txt2); transition:.2s; white-space:nowrap; }
    .pill:hover { border-color:rgba(245,166,35,.4); color:var(--txt); }
    .pill.active { background:var(--y); color:#07011C; border-color:var(--y); font-weight:700; }
    .pills-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:32px; }



    /* ── Footer ── */
    .footer { background:var(--bg2); border-top:1px solid var(--bdr); padding:48px 24px 32px; }
    .footer-inner { max-width:1300px; margin:0 auto; display:grid; gap:40px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }

    /* ── Modal ── */
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(6px); }
    .modal-box { background:var(--bg2); border:1px solid var(--bdr); border-radius:14px; max-width:560px; width:100%; max-height:90vh; overflow-y:auto; }

    /* ── Tags ── */
    .tag { display:inline-block; font-size:.65rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:5px; }
    .tag-y { background:rgba(223,200,174,.15); color:var(--y); }
    .tag-p { background:rgba(223,200,174,.12); color:var(--yl); }

    /* ── WhatsApp float ── */
    .wa-float { position:fixed; bottom:24px; right:24px; z-index:100; background:#25D366; width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 24px rgba(37,211,102,.45); cursor:pointer; text-decoration:none; transition:transform .2s,box-shadow .2s; }
    .wa-float:hover { transform:scale(1.1); box-shadow:0 8px 32px rgba(37,211,102,.55); }


    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:rgba(223,200,174,.25); border-radius:99px; }

    /* ── No results ── */
    .no-results { text-align:center; padding:80px 20px; }
    .no-results-icon { font-size:3rem; margin-bottom:16px; opacity:.5; }
    .no-results-text { color:var(--txt2); font-size:.9rem; }

    /* ── Responsive ── */
    @media(max-width:768px) {
      .navbar-inner { height:64px; padding:0 20px; }
    }

    @media(max-width:640px) {
      .section { padding:40px 16px; }
      .hero-section { min-height:75vh; }
      .hero-content { padding:60px 20px 50px; }
      .promo-bar { padding:9px 40px 9px 14px; font-size:.73rem; text-align:left; line-height:1.4; }

      /* Cards: 2 columnas compactas */
      .cat-grid { grid-template-columns:1fr 1fr; gap:10px; }
      .pcard-img { aspect-ratio:1; }

      /* Pills: scroll horizontal, no wrap */
      .pills-row { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:4px; margin-bottom:20px; gap:8px; }
      .pills-row::-webkit-scrollbar { display:none; }
      .pill { flex-shrink:0; padding:6px 14px; font-size:.76rem; }

      /* Search */
      .search-input { font-size:1rem; padding:11px 44px 11px 46px; }

      /* Modal como bottom-sheet en mobile */
      .modal-backdrop { align-items:flex-end; padding:0; }
      .modal-box { border-radius:20px 20px 0 0; max-height:92vh; width:100%; max-width:100%; }

      /* Footer */
      .footer { padding:36px 16px 28px; }
      .footer-inner { grid-template-columns:1fr; gap:28px; }

      /* WA float más chico en mobile */
      .wa-float { width:50px; height:50px; bottom:18px; right:18px; }

    }

    @media(max-width:480px) {
      .hero-content { padding:52px 18px 44px; }
      .sec-title { font-size:clamp(1.5rem,7vw,2rem); }
      .navbar-inner { height:58px; }
    }

    @media(max-width:400px) {
      .cat-grid { grid-template-columns:1fr; gap:12px; }
    }

    /* ── Hero letter animation ── */
    @keyframes letterUp {
      from { opacity:0; transform:translateY(36px) rotateX(-55deg); filter:blur(6px); }
      to   { opacity:1; transform:translateY(0)    rotateX(0deg);   filter:blur(0); }
    }
    .hl {
      display:inline-block;
      animation: letterUp .55s cubic-bezier(.16,1,.3,1) both;
      transform-origin: 50% 100%;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const DEF_SETTINGS = {
  phone:       "",
  instagram:   "@muebleo.ve",
  siteName:    "Muebleo",
  tagline:     "Escritorios, sillas y todo para tu espacio de trabajo.",
  heroLabel:   "Catálogo 2026",
  heroImg:     "https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=1600&q=90",
  logoImg:     "",
  promoText:   "🎉 Ofertas de lanzamiento — precios especiales de apertura. ¡Consultá ahora!",
  faviconImg:  "",
  galleryImgs: "[]",
};

/* ─── Reveal on scroll ─── */
function useReveal() {
  useEffect(() => {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if(e.isIntersecting) { e.target.classList.add('on'); obs.unobserve(e.target); } });
    }, { threshold: 0.08 });
    document.querySelectorAll('.rv').forEach(el => obs.observe(el));
    return () => obs.disconnect();
  });
}

/* ─── Price formatter (always USD) ─── */
const fmtPrice = p => p && (p.trim().startsWith('$') ? p.trim() : `$${p.trim()}`);

/* ─── Animated hero title ─── */
function AnimatedTitle({ text, delay = 0.2 }) {
  return (
    <span style={{display:"inline-block", perspective:"600px"}}>
      {[...text].map((ch, i) => (
        <span key={i} className="hl"
          style={{animationDelay:`${delay + i * 0.06}s`}}>
          {ch === ' ' ? ' ' : ch}
        </span>
      ))}
    </span>
  );
}

/* ─── Brand logo ─── */
function BrandLogo({ logoImg, siteName, size = 48 }) {
  const [customErr, setCustomErr] = useState(false);
  const [iconErr,   setIconErr]   = useState(false);

  if (logoImg && !customErr) {
    return (
      <img src={logoImg} onError={() => setCustomErr(true)}
        style={{height:size, maxWidth:220, objectFit:"contain", display:"block"}} alt={siteName}/>
    );
  }
  // White wordmark SVG already contains icon + "Muebleo" text — no extra text needed
  if (!iconErr) {
    return (
      <img src="/isotripomuebleo-white.svg" onError={() => setIconErr(true)}
        style={{height:Math.round(size*.65), width:"auto", display:"block", maxWidth:180}} alt={siteName}/>
    );
  }
  // Fallback letter
  return (
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <div style={{width:size,height:size,background:"var(--y)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:size*.5,color:"#07011C",fontFamily:"Syne,sans-serif",flexShrink:0}}>M</div>
      <span style={{fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:"1.1rem",color:"var(--txt)",letterSpacing:".01em",whiteSpace:"nowrap"}}>{siteName}</span>
    </div>
  );
}

/* ─── Navbar ─── */
function Navbar({ settings }) {
  const [open, setOpen] = useState(false);
  const links = [
    { label:"Catálogo", href:"#catalogo" },
    { label:"Contacto", href:"#contacto" },
  ];
  return (
    <nav className="navbar">
      <div className="navbar-inner">
        <BrandLogo logoImg={settings.logoImg} siteName={settings.siteName}/>
        <div className="nav-links">
          {links.map(l => <a key={l.label} className="nav-link" href={l.href}>{l.label}</a>)}
        </div>
        <button className="hamburger" onClick={() => setOpen(o => !o)} aria-label="Menú">
          <span/><span/><span/>
        </button>
      </div>
      <div className={`mobile-menu ${open ? 'open' : ''}`}>
        {links.map(l => (
          <a key={l.label} className="nav-link" href={l.href} onClick={() => setOpen(false)}>{l.label}</a>
        ))}
      </div>
    </nav>
  );
}

/* ─── Promo bar ─── */
function PromoBar({ text }) {
  const [visible, setVisible] = useState(true);
  if (!visible || !text) return null;
  return (
    <div className="promo-bar">
      {text}
      <button className="promo-close" onClick={() => setVisible(false)}>×</button>
    </div>
  );
}

/* ─── Hero ─── */
function Hero({ settings }) {
  const wa = settings.phone
    ? `https://wa.me/${settings.phone.replace(/\D/g,'')}?text=Hola!%20Vi%20el%20catálogo%20de%20Muebleo%20y%20quiero%20consultar.`
    : '#catalogo';
  return (
    <section className="hero-section" id="inicio">
      <img className="hero-bg" src={settings.heroImg} alt="" aria-hidden="true"/>
      <div className="hero-overlay"/>
      <div className="hero-content">
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:28}}>
          <div style={{width:2,height:44,background:"var(--y)",borderRadius:2}}/>
          <span style={{fontSize:".72rem",fontWeight:700,letterSpacing:".18em",textTransform:"uppercase",color:"var(--y)"}}>{settings.heroLabel}</span>
        </div>
        <h1 className="fp" style={{fontSize:"clamp(3rem,9vw,6rem)",fontWeight:900,lineHeight:.95,letterSpacing:"-.03em"}}>
          <AnimatedTitle text={settings.siteName} delay={0.3}/>
        </h1>
        <p className="rv d1" style={{fontSize:"1.15rem",color:"rgba(238,240,255,.8)",marginTop:22,maxWidth:520,lineHeight:1.7}}>
          {settings.tagline}
        </p>
        <div className="rv d2" style={{display:"flex",gap:14,marginTop:44,flexWrap:"wrap"}}>
          <a href="#catalogo" style={{background:"var(--y)",color:"#07011C",fontWeight:700,padding:"14px 38px",borderRadius:8,textDecoration:"none",fontSize:"1rem",letterSpacing:".02em"}}>Ver catálogo</a>
          {settings.phone && (
            <a href={wa} target="_blank" rel="noreferrer"
              style={{background:"rgba(240,235,228,.08)",color:"var(--txt)",border:"1px solid rgba(240,235,228,.2)",padding:"14px 32px",borderRadius:8,textDecoration:"none",fontSize:"1rem",backdropFilter:"blur(8px)"}}>
              Consultar por WhatsApp
            </a>
          )}
        </div>
      </div>
    </section>
  );
}

/* ─── Product card ─── */
function PCard({ p, onClick }) {
  return (
    <div id={`producto-${p.id}`} className="pcard rv" onClick={() => onClick(p)}>
      <div className="pcard-img">
        <img src={p.img || "https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=600&q=80"} alt={p.name} loading="lazy"/>
      </div>
      <div style={{padding:"16px 18px 20px"}}>
        <span className="tag tag-p">{p.cat}</span>
        <h3 className="fp" style={{fontWeight:700,fontSize:"1rem",lineHeight:1.3,color:"var(--txt)",marginTop:8}}>{p.name}</h3>
        {p.desc && <p style={{fontSize:".78rem",color:"var(--txt2)",marginTop:6,lineHeight:1.5,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{p.desc}</p>}
        {p.size && <p style={{fontSize:".72rem",color:"var(--txt3)",marginTop:6}}>{p.size}</p>}
        {p.showPrice && p.price && (
          <div style={{marginTop:12,fontWeight:700,fontSize:"1.05rem",color:"var(--y)"}}>{fmtPrice(p.price)}</div>
        )}
      </div>
    </div>
  );
}

/* ─── Product modal ─── */
function PModal({ p, settings, onClose }) {
  if (!p) return null;
  const lines = [
    `Hola! Me interesa este producto del catálogo de Muebleo:`,
    ``,
    `*${p.name}*`,
    `Categoría: ${p.cat}`,
    p.showPrice && p.price ? `Precio: ${fmtPrice(p.price)}` : null,
    p.size     ? `Medidas: ${p.size}`     : null,
    p.material ? `Material: ${p.material}` : null,
    ``,
    `Ver producto: https://muebleo.shop/#producto-${p.id}`,
  ].filter(l => l !== null).join('\n');
  const wa = settings.phone
    ? `https://wa.me/${settings.phone.replace(/\D/g,'')}?text=${encodeURIComponent(lines)}`
    : null;
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-box" onClick={e => e.stopPropagation()}>
        <div style={{aspectRatio:"16/9",overflow:"hidden",borderRadius:"14px 14px 0 0",background:"var(--bg3)"}}>
          <img src={p.img || "https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=600&q=80"} alt={p.name} style={{width:"100%",height:"100%",objectFit:"contain"}}/>
        </div>
        <div style={{padding:"24px"}}>
          <span className="tag tag-p">{p.cat}</span>
          <h2 className="fp" style={{fontSize:"1.5rem",fontWeight:800,marginTop:10}}>{p.name}</h2>
          {p.desc && <p style={{color:"var(--txt2)",fontSize:".875rem",marginTop:10,lineHeight:1.65}}>{p.desc}</p>}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginTop:16}}>
            {p.size     && <div><div style={{fontSize:".68rem",color:"var(--txt3)",marginBottom:3,textTransform:"uppercase",letterSpacing:".06em"}}>Medidas</div><div style={{fontSize:".875rem"}}>{p.size}</div></div>}
            {p.material && <div><div style={{fontSize:".68rem",color:"var(--txt3)",marginBottom:3,textTransform:"uppercase",letterSpacing:".06em"}}>Material</div><div style={{fontSize:".875rem"}}>{p.material}</div></div>}
          </div>
          {p.showPrice && p.price && <div style={{marginTop:16,fontSize:"1.4rem",fontWeight:800,color:"var(--y)"}}>{fmtPrice(p.price)}</div>}
          <div style={{display:"flex",gap:10,marginTop:22,flexWrap:"wrap"}}>
            {wa && (
              <a href={wa} target="_blank" rel="noreferrer"
                style={{flex:1,minWidth:180,background:"#25D366",color:"#fff",fontWeight:700,padding:"12px 0",borderRadius:8,textAlign:"center",textDecoration:"none",fontSize:".875rem",fontFamily:"inherit"}}>
                Consultar por WhatsApp
              </a>
            )}
            <button onClick={onClose} style={{background:"transparent",border:"1px solid var(--bdr)",color:"var(--txt2)",fontSize:".8rem",padding:"10px 16px",borderRadius:8,cursor:"pointer",fontFamily:"inherit"}}>Cerrar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── Catalog ─── */
function Catalog({ products, categories, settings }) {
  const [filter, setFilter] = useState("Todos");
  const [search, setSearch] = useState("");
  const [modal, setModal]   = useState(null);
  useReveal();

  const catNames = ["Todos", ...categories.map(c => c.name)];

  const shown = products.filter(p => {
    const matchCat = filter === "Todos" || p.cat === filter;
    const q = search.toLowerCase().trim();
    const matchSearch = !q ||
      p.name.toLowerCase().includes(q) ||
      (p.desc     || '').toLowerCase().includes(q) ||
      (p.cat      || '').toLowerCase().includes(q) ||
      (p.material || '').toLowerCase().includes(q) ||
      (p.size     || '').toLowerCase().includes(q);
    return matchCat && matchSearch;
  });

  return (
    <section id="catalogo">
      <div className="section">
        <div className="rv">
          <p className="sec-label">Nuestros productos</p>
          <h2 className="fp sec-title">Catálogo completo</h2>
          <div className="y-line"/>
        </div>

        {/* Search bar */}
        <div className="rv d1">
          <div className="search-wrap">
            <span className="search-icon">🔍</span>
            <input
              className="search-input"
              type="text"
              placeholder="Buscar por nombre, categoría, material…"
              value={search}
              onChange={e => setSearch(e.target.value)}
            />
            {search && (
              <button className="search-clear" onClick={() => setSearch('')} aria-label="Limpiar">×</button>
            )}
          </div>
        </div>

        {/* Category pills */}
        <div className="pills-row rv d2">
          {catNames.map(c => (
            <button key={c} className={`pill ${filter === c ? 'active' : ''}`} onClick={() => setFilter(c)}>{c}</button>
          ))}
        </div>

        {/* Results info */}
        {(search || filter !== "Todos") && (
          <p style={{fontSize:".78rem",color:"var(--txt2)",marginBottom:20}}>
            {shown.length === 0 ? 'Sin resultados' : `${shown.length} producto${shown.length !== 1 ? 's' : ''} encontrado${shown.length !== 1 ? 's' : ''}`}
            {search && <> para <strong style={{color:"var(--txt)"}}>&ldquo;{search}&rdquo;</strong></>}
            {filter !== "Todos" && <> en <strong style={{color:"var(--y)"}}>{filter}</strong></>}
            {(search || filter !== "Todos") && (
              <button onClick={() => { setSearch(''); setFilter('Todos'); }}
                style={{marginLeft:8,background:"none",border:"none",color:"var(--y)",cursor:"pointer",fontFamily:"inherit",fontSize:"inherit",textDecoration:"underline",padding:0}}>
                Limpiar filtros
              </button>
            )}
          </p>
        )}

        {shown.length === 0 ? (
          <div className="no-results rv">
            <div className="no-results-icon">🔍</div>
            <p className="no-results-text">No encontramos productos con esa búsqueda.<br/>Probá con otras palabras o explorá las categorías.</p>
          </div>
        ) : (
          <div className="cat-grid">
            {shown.map(p => <PCard key={p.id} p={p} onClick={setModal}/>)}
          </div>
        )}
      </div>
      {modal && <PModal p={modal} settings={settings} onClose={() => setModal(null)}/>}
    </section>
  );
}



/* ─── Footer ─── */
function Footer({ settings, categories }) {
  const wa = settings.phone
    ? `https://wa.me/${settings.phone.replace(/\D/g,'')}?text=Hola!%20Vi%20el%20catálogo%20de%20Muebleo%20y%20quiero%20consultar.`
    : null;
  return (
    <footer className="footer" id="contacto">
      <div className="footer-inner">
        <div>
          <BrandLogo logoImg={settings.logoImg} siteName={settings.siteName}/>
          <p style={{color:"var(--txt2)",fontSize:".8rem",marginTop:14,lineHeight:1.7,maxWidth:240}}>{settings.tagline}</p>
        </div>
        <div>
          <div style={{fontSize:".7rem",fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",color:"var(--txt3)",marginBottom:14}}>Contacto</div>
          {wa && <a href={wa} target="_blank" rel="noreferrer" style={{display:"block",color:"var(--txt2)",textDecoration:"none",fontSize:".875rem",marginBottom:10}}>📱 {settings.phone}</a>}
          {settings.instagram && (
            <a href={`https://instagram.com/${settings.instagram.replace("@","")}`} target="_blank" rel="noreferrer" style={{display:"block",color:"var(--txt2)",textDecoration:"none",fontSize:".875rem"}}>
              📷 {settings.instagram}
            </a>
          )}
        </div>
        {categories.length > 0 && (
          <div>
            <div style={{fontSize:".7rem",fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",color:"var(--txt3)",marginBottom:14}}>Categorías</div>
            {categories.slice(0,6).map(c => (
              <div key={c.id} style={{color:"var(--txt2)",fontSize:".875rem",marginBottom:8}}>{c.name}</div>
            ))}
          </div>
        )}
      </div>
      <div style={{maxWidth:1300,margin:"28px auto 0",paddingTop:24,borderTop:"1px solid var(--bdr)",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <span style={{color:"var(--txt3)",fontSize:".75rem"}}>© 2026 {settings.siteName}. Todos los derechos reservados.</span>
        <span style={{color:"var(--txt3)",fontSize:".75rem"}}>muebleo.shop</span>
      </div>
    </footer>
  );
}

/* ─── App ─── */
function App() {
  const [products,   setProducts]   = useState([]);
  const [categories, setCategories] = useState([]);
  const [settings,   setSettings]   = useState(DEF_SETTINGS);
  const [loading,    setLoading]    = useState(true);

  useEffect(() => {
    Promise.all([
      fetch('/api/products.php').then(r => r.json()),
      fetch('/api/categories.php').then(r => r.json()),
      fetch('/api/settings.php').then(r => r.json()),
    ])
    .then(([prods, cats, sett]) => {
      if (Array.isArray(prods)) setProducts(prods);
      if (Array.isArray(cats))  setCategories(cats);
      setSettings(prev => ({ ...prev, ...sett }));
      if (sett.faviconImg) {
        let link = document.querySelector("link[rel*='icon']");
        if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
        link.href = sett.faviconImg;
      }
    })
    .catch(console.error)
    .finally(() => setLoading(false));
  }, []);

  const wa = settings.phone
    ? `https://wa.me/${settings.phone.replace(/\D/g,'')}?text=Hola!%20Vi%20el%20catálogo%20de%20Muebleo%20y%20quiero%20consultar.`
    : null;

  if (loading) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)"}}>
      <div style={{textAlign:"center"}}>
        <img src="/isotripomuebleo-white.svg" style={{height:56,margin:"0 auto 16px",display:"block",opacity:.7}} alt=""
          onError={e => { e.target.style.display='none'; }}/>
        <div style={{color:"var(--txt2)",fontSize:".875rem"}}>Cargando catálogo…</div>
      </div>
    </div>
  );

  return (
    <div>
      <PromoBar text={settings.promoText}/>
      <Navbar settings={settings}/>
      <Hero settings={settings}/>
      <Catalog products={products} categories={categories} settings={settings}/>
      <Footer settings={settings} categories={categories}/>

      {wa && (
        <a href={wa} target="_blank" rel="noreferrer" className="wa-float" title="Consultar por WhatsApp">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="white">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>
        </a>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
